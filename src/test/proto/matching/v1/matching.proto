syntax = "proto3";

package matching.v1;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

// MatchingService exercises protobuf JSON conventions without generated Java classes.
service MatchingService {
  // Match accepts a message for request-matching tests.
  rpc Match(MatchRequest) returns (MatchResponse);
  // Watch verifies that streaming methods are rejected by the unary matcher.
  rpc Watch(WatchRequest) returns (stream WatchResponse);
}

message MatchRequest {
  string display_name = 1;
  int64 user_id = 2;
  bytes payload = 3;
  Status status = 4;
  repeated string labels = 5;
  optional string nickname = 6;
  map<string, int32> counts = 7;
  google.protobuf.Timestamp observed_at = 8;
  google.protobuf.Any detail = 9;
}

message MatchResponse {
  MatchRequest echo = 1;
}

message WatchRequest {}

message WatchResponse {}

message Details {
  string text = 1;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
}
