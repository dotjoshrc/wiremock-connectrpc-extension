name: Pull Request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: examples/client/go.mod
          cache-dependency-path: examples/client/go.sum

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: '1.75.0'

      - name: Lint Java
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          org.apache.maven.plugins:maven-checkstyle-plugin:3.6.0:check
          -Dcheckstyle.config.location=.github/checkstyle.xml
          -Dcheckstyle.includeTestSourceDirectory=true

      - name: Check Go formatting
        working-directory: examples/client
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet Go
        working-directory: examples/client
        run: go vet ./...

      - name: Lint example protobuf schemas
        run: |
          buf format --diff --exit-code
          buf lint

      - name: Lint test protobuf schemas
        working-directory: src/test/proto
        run: |
          buf format --diff --exit-code
          buf lint

      - name: Run unit and integration tests
        run: ./mvnw --batch-mode --no-transfer-progress verify
